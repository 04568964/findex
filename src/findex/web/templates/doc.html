<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ doc.title }} — findex</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; line-height: 1.6; }
    a { color: #1d4ed8; text-decoration: none; }
    .meta { color: #6b7280; font-size: .9rem; margin-bottom: 1.5rem; }
    pre { white-space: pre-wrap; font-family: inherit; background: #f9fafb; padding: 1.25rem; border: 1px solid #e5e7eb; border-radius: 6px; }
  </style>
</head>
<body>
  <p><a href="javascript:history.back()">&larr; Back to search</a></p>
  <h1>{{ doc.title }}</h1>
  <div class="meta">doc #{{ doc.doc_id }} &middot; {{ doc.length }} tokens &middot; {{ doc.path }}</div>
  {% if doc.text %}
    <pre>{{ doc.text }}</pre>
  {% else %}
    <p class="meta">Source file is not available locally on disk.</p>
  {% endif %}
</body>
</html>
