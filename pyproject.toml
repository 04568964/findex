[project]
name = "findex"
version = "0.7.0"
description = "Full-text search engine"
readme = "README.md"
authors = [
    { name = "Avr", email = "8660119@stud.kai.edu.ua" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pyright>=1.1.380",
    "ruff>=0.6.0",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests taking longer than 1 second",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["scripts"]